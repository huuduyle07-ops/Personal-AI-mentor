[project]
name = "personal-ai-mentor"
version = "0.1.0"
description = "Local-first personal accountability Discord MVP with optional offline routing research"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "aiohttp>=3.14.5",
    "discord>=2.3.2",
    "dotenv>=0.9.9",
    "pytest>=9.2.0",
]

[project.optional-dependencies]
research = [
    "scikit-learn>=1.9.1",
]
