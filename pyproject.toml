[project]
name = "personal-ai-mentor"
version = "0.1.0"
description = "Local-first personal accountability Discord MVP with optional offline routing research"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "aiohttp>=3.14.5",
    "discord.py>=2.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
research = [
    "numpy>=2.4.6",
    "scikit-learn>=1.9.1",
]
dashboard = [
    "faster-whisper>=1.1",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
