# LoRA fine-tuning of TinyLlama-1.1B-Chat on the bot's intent task, with Apple MLX (mlx-lm).
# Base weights stay frozen; only the small low-rank adapter matrices are trained.
model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
train: true
fine_tune_type: lora
data: "experiments/intent_sft/data"
seed: 0

# Loss only on the answer (the JSON), not on the long system prompt or the user's message.
mask_prompt: true
max_seq_length: 1024

num_layers: 22            # all transformer blocks
batch_size: 4
iters: 300                # about one pass over the 1,119 training examples (4 per step)
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 30
  arguments: [1.0e-4, 300, 1.0e-6]
grad_checkpoint: true

steps_per_report: 10
steps_per_eval: 75
val_batches: -1           # score the whole validation split
save_every: 75
adapter_path: "experiments/intent_sft/artifacts/adapter"

lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj",
         "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
  rank: 16
  scale: 2.0
  dropout: 0.05
