[project]
name = "real-world-knowledge-tracing"
version = "0.1.0"
description = "Isolated noncommercial SLAM next-exercise correctness pilot"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.4,<3", "scikit-learn>=1.9,<2", "torch>=2.6,<3",
  "psutil>=7,<8", "pyarrow>=19,<24", "matplotlib>=3.9,<4", "pytest>=9,<10",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
