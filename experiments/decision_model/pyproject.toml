[project]
name = "accountability-temporal-benchmark"
version = "0.1.0"
description = "Isolated synthetic temporal outcome benchmark; shadow mode only"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.4,<3",
    "scikit-learn>=1.9,<2",
    "torch>=2.6,<3",
    "psutil>=7,<8",
    "pytest>=9,<10",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
